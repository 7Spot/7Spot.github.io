<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="JUN7">
  <meta name="description" content="7Spot，JUN7 的小玩意和日常分享">
  <title>7Spot</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1f1f1f; --muted: #7a7a72; --accent: #ff7a59; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #f0efe9; --muted: #9a9a92; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Noto Sans SC", sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; text-align: center; }
    h1 { font-size: clamp(2.4rem, 9vw, 4.5rem); margin: 0 0 .3em; letter-spacing: .02em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 1.1rem; margin: .3em 0; }
    .by { font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>7Spot<span>.</span></h1>
      <p>网站搭建中，很快就来 🚧</p>
      <p class="by">by JUN7</p>
    </div>
  </main>
</body>
</html>
